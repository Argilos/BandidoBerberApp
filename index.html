<!doctype html>
<html lang="bs" class="bg-matte-black">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>Bandido by Himzo | Ekskluzivni Barbershop</title>

  <!-- Preconnect to Font Servers -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
      rel="stylesheet">
  </noscript>

  <style>
    /* Critical Splash Screen CSS */
    #app-loader {
      position: fixed;
      inset: 0;
      background: #0A0A0A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out, visibility 0.5s;
    }

    .loader-logo {
      font-family: 'Playfair Display', serif;
      color: #D4AF37;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      margin-bottom: 2rem;
      animation: pulse 2s infinite ease-in-out;
    }

    .loader-bar {
      width: 120px;
      height: 2px;
      background: rgba(212, 175, 55, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .loader-progress {
      width: 40%;
      height: 100%;
      background: #D4AF37;
      border-radius: 4px;
      animation: progress 1.5s infinite ease-in-out;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.6;
        transform: scale(0.98);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes progress {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(250%);
      }
    }

    body.loaded #app-loader {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>

<body>
  <!-- Instant Splash Screen -->
  <div id="app-loader">
    <div class="loader-logo">BANDIDO</div>
    <div class="loader-bar">
      <div class="loader-progress"></div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <script>
    // Remove loader when app is ready
    window.addEventListener('load', () => {
      document.body.classList.add('loaded');
    });
  </script>
</body>

</html>
